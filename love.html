<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เขารักตัวนะ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #e0f7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 700px;
    }
    h1 {
      font-size: 3em;
      color: #ff69b4;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.5em;
      color: #555;
      margin-bottom: 30px;
    }
    button {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #ff85c1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>เขารักตัวนะ 💗</h1>
    <p>ไม่ว่าบี๋ๆ จะรู้สึกยังไง หรือเหนื่อยแค่ไหน เค้าก็อยู่ตรงนี้เสมอ เป็นกำลังใจให้บี๋ๆ ตลอดไปนะ 🤍</p>
    <button onclick="goBack()">กลับไปหน้าแรก</button>
  </div>

  <script>
    function goBack() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
