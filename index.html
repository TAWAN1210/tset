<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สุขสันต์วันเกิดบี๋ๆ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #e0f7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 700px;
    }
    h1 {
      font-size: 3em;
      color: #ff69b4;
      animation: bounce 2s infinite;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2em;
      color: #555;
      margin-bottom: 30px;
    }
    iframe {
      width: 100%;
      max-width: 560px;
      height: 315px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    button {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #ff85c1;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>สุขสันต์วันเกิดบี๋ๆ 🎂</h1>
    <p>เค้าอยากให้บี๋ๆ มีความสุขมากๆ นะ ขอให้ปีนี้เป็นปีที่ดีและพิเศษสำหรับบี๋ๆ เค้าอยู่ตรงนี้เสมอ เป็นกำลังใจให้บี๋ๆ น้า 💖</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/Itvw76ej4Mk?si=3xF03LTFpwrIm8o-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <br>
    <button onclick="goToLovePage()">คลิกที่นี่สิ บี๋ๆ 💘</button>
  </div>

  <script>
    function goToLovePage() {
      window.location.href = "love.html";
    }
  </script>
</body>
</html>
